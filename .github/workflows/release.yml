# Builds the installable app on real mac, windows and linux machines and attaches
# the installers to a GitHub Release.
#   - push a tag like v0.1.0  → release "v0.1.0"
#   - every push to main (code changes) or a manual run → release "latest-build"
#     (marked latest, so /releases/latest/download/… links always get the newest app)
name: build app

on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# a newer push replaces a build still in progress, so latest-build is always the newest main
concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: build fn-key helper (universal, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/fnwatch resources/mac
          swiftc -O -target arm64-apple-macos12 native/macos/fnwatch.swift -o build/fnwatch/fnwatch-arm64
          swiftc -O -target x86_64-apple-macos12 native/macos/fnwatch.swift -o build/fnwatch/fnwatch-x64
          lipo -create build/fnwatch/fnwatch-arm64 build/fnwatch/fnwatch-x64 -output resources/mac/fnwatch
          chmod +x resources/mac/fnwatch
          codesign -s - -f resources/mac/fnwatch
          lipo -info resources/mac/fnwatch
      - name: build agent-mode input helper (universal, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/clickity-input resources/mac
          swiftc -O -target arm64-apple-macos12 native/macos/clickity-input.swift -o build/clickity-input/clickity-input-arm64
          swiftc -O -target x86_64-apple-macos12 native/macos/clickity-input.swift -o build/clickity-input/clickity-input-x64
          lipo -create build/clickity-input/clickity-input-arm64 build/clickity-input/clickity-input-x64 -output resources/mac/clickity-input
          chmod +x resources/mac/clickity-input
          codesign -s - -f resources/mac/clickity-input
          lipo -info resources/mac/clickity-input
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: clickity-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: replace previous latest-build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest build' }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            download the installer for your computer:
            - **mac (apple silicon, m1–m4):** `…-mac-arm64.dmg`
            - **mac (intel):** `…-mac-x64.dmg`
            - **windows:** `…-win-x64.exe`
            - **linux:** `…-linux-x86_64.AppImage` or `.deb`

            mac: the app isn't notarized by apple, so macos blocks the first launch. click "done", then system settings › privacy & security › scroll down › "open anyway". or run once in terminal: `xattr -dr com.apple.quarantine /Applications/Clickity.app`
            windows: smartscreen may warn — click "more info" › "run anyway".
