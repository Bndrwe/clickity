# Builds the installable app on real mac, windows and linux machines and attaches
# the installers to a GitHub Release.
#   - push a tag like v0.1.0  → release "v0.1.0"
#   - run manually (actions tab › build app › run workflow) → prerelease "latest-build"
name: build app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: clickity-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: replace previous latest-build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            download the installer for your computer:
            - **mac (apple silicon, m1–m4):** `…-mac-arm64.dmg`
            - **mac (intel):** `…-mac-x64.dmg`
            - **windows:** `…-win-x64.exe`
            - **linux:** `…-linux-x86_64.AppImage` or `.deb`

            mac: the app isn't notarized by apple, so macos blocks the first launch. click "done", then system settings › privacy & security › scroll down › "open anyway". or run once in terminal: `xattr -dr com.apple.quarantine /Applications/Clickity.app`
            windows: smartscreen may warn — click "more info" › "run anyway".
