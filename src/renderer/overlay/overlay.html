<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clickity overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="./overlay.css" />
    <link rel="stylesheet" href="./visuals.css" />
    <script>
      // theme before first paint; config refines it once it arrives
      if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <!-- the cursor's ink trail while the talk chord is held (outside the stage: it shows on every display the path crosses) -->
    <canvas id="ink" class="ink" aria-hidden="true"></canvas>
    <div id="stage" class="stage is-hidden" aria-hidden="true">
      <div id="ripples" class="ripples"></div>
      <div id="pill-pos" class="pos"><div id="pill" class="pill"></div></div>

      <div id="companion" class="pos companion">
        <div class="shadow"></div>
        <div id="body" class="body">
          <div class="ring"></div>
          <svg id="arrow" class="arrow" viewBox="0 0 32 32" aria-hidden="true">
            <path class="halo" d="M16 3 L26 27 L16 21.5 L6 27 Z" />
            <path class="fill" d="M16 3 L26 27 L16 21.5 L6 27 Z" />
          </svg>
        </div>
        <div class="aux">
          <div id="wave" class="wave"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="dots"><i></i><i></i><i></i></div>
        </div>
      </div>

      <div id="bubble-pos" class="pos">
        <div id="bubble" class="bubble" role="status" aria-live="polite">
          <p id="step" class="step"></p>
          <div class="collapse transcript-wrap"><div><p id="transcript" class="transcript"></p></div></div>
          <div id="reply" class="reply"><div id="reply-text" class="reply-text"></div></div>
          <p id="error" class="error"></p>
          <p id="note" class="note"></p>
          <div id="confirm" class="confirm">
            <p id="confirm-text" class="confirm-text"></p>
            <p class="confirm-hint"><kbd>enter</kbd> <span class="ca-once">to allow</span><span class="ca-always">allow once</span> <span aria-hidden="true">·</span> <span class="ca-always"><kbd>a</kbd> always allow <span aria-hidden="true">·</span> </span><kbd>esc</kbd> <span class="ca-once">to cancel</span><span class="ca-always">not now</span></p>
          </div>
          <!-- a choice question ([ASK:…]): numbered option pills + "something else…" -->
          <div id="choice-wrap" class="collapse choice-wrap"><div>
            <div id="choice" class="choice" role="group" aria-label="choose an answer">
              <div id="choice-opts" class="choice-opts"></div>
              <p id="choice-hint" class="choice-hint"></p>
            </div>
          </div></div>
          <!-- quick follow-up: continue the same chat in the type box under the bubble -->
          <div id="reply-row" class="reply-row"><button id="reply-btn" class="reply-btn" type="button" tabindex="-1">reply</button></div>
          <!-- busy: "esc to stop" / "esc to pause" + stop; a paused agent run: continue / stop -->
          <div id="stop-row" class="stop-row">
            <p id="stop-hint" class="stop-hint"></p>
            <button id="continue-btn" class="stop-btn go" type="button" tabindex="-1">continue</button>
            <button id="stop-btn" class="stop-btn" type="button" tabindex="-1"><span class="sq" aria-hidden="true"></span><span id="stop-btn-t">stop</span></button>
          </div>
        </div>
      </div>

      <div id="typebox-pos" class="pos">
        <form id="typebox" class="typebox" autocomplete="off">
          <input id="typebox-input" type="text" placeholder="ask clickity…" aria-label="ask clickity" spellcheck="false" />
        </form>
      </div>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
