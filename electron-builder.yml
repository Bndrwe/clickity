appId: com.clickity.app
productName: Clickity
copyright: Copyright © 2026 the clickyclone contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - "!**/*.map"
npmRebuild: false # uiohook-napi ships N-API prebuilds for mac, windows and linux
asarUnpack:
  - node_modules/uiohook-napi/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  icon: assets/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signature: no Apple developer account needed. macOS will ask you to
  # confirm the first launch (right-click › open). Set CSC_LINK to sign properly.
  identity: "-"
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: clickity listens while you hold the talk key.
    NSAppleEventsUsageDescription: clickity uses apple events for system integration.
dmg:
  title: Clickity
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Clickity
  runAfterFinish: true

linux:
  icon: assets/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: clickyclone contributors
  synopsis: an ai companion that lives next to your cursor
